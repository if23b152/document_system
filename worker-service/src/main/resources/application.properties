# -----------------------------------------------------------------
# Worker service general settings
# -----------------------------------------------------------------
# Name of the Spring Boot application
spring.application.name=worker-service

# Port the REST server listens on inside the container
server.port=8082

# -----------------------------------------------------------------
# 1. PostgreSQL Connection Settings (Required for status updates in later Sprints)
# -----------------------------------------------------------------
# JDBC URL to connect to the PostgreSQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/documentdb}

# Database username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

# Database password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Fully qualified driver class name for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate setting: controls how the database schema is updated
# 'update' allows automatic updates; in workers, consider 'none' to avoid accidental changes
spring.jpa.hibernate.ddl-auto=update

# Do not log SQL statements (may contain document text / user data)
spring.jpa.show-sql=false

# -----------------------------------------------------------------
# 2. RabbitMQ Connection Settings (Consumer)
# -----------------------------------------------------------------
# RabbitMQ host must match the service name in docker-compose.yml
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}

# Port for RabbitMQ communication
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}

# RabbitMQ username
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}

# RabbitMQ password
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# -----------------------------------------------------------------
# 3. MinIO Configuration
# -----------------------------------------------------------------
# URL of the MinIO server
minio.endpoint=${MINIO_URL:http://minio:9000}

# Access key for MinIO authentication
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}

# Secret key for MinIO authentication
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# Bucket name in MinIO where documents are stored
minio.bucket=${MINIO_BUCKET:documents}

# -----------------------------------------------------------------
# 4. GenAI Configuration
# -----------------------------------------------------------------
# 1. The Model Name
# This is a sensible default, but can be overridden by an environment variable (e.g., GEMINI_MODEL_NAME)
# The default model is usually 'gemini-2.5-flash' for speed and cost-effectiveness.
gemini.model.name=gemini-2.5-flash-lite

# 2. The API Key Source (Crucial Step)
# This tells Spring to look for an environment variable named 'GOOGLE_API_KEY'.
# Spring's @Value annotation will resolve this expression.
gemini.api.key=${GOOGLE_API_KEY}

# -----------------------------------------------------------------
# 5. ElasticSearch Configuration
# -----------------------------------------------------------------
# Spring Boot property to tell the application where Elasticsearch is running.
# It uses the environment variable ELASTICSEARCH_HOST, which should be something like:
#    http://localhost:9200
# This is the base URL that Spring Boot will use to connect to the ES cluster.
spring.elasticsearch.uris=${ELASTICSEARCH_HOST}
