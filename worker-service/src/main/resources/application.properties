spring.application.name=worker-service
server.port=8082

# -----------------------------------------------------------------
# 1. PostgreSQL Connection Settings (Required for status updates in later Sprints)
# -----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/documentdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Set ddl-auto to none in workers to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# -----------------------------------------------------------------
# 2. RabbitMQ Connection Settings (Consumer)
# -----------------------------------------------------------------
# Host and Port must match the rabbitmq service in docker-compose.yml
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# -----------------------------------------------------------------
# 3. MinIO Configuration
# -----------------------------------------------------------------
minio.endpoint=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=documents