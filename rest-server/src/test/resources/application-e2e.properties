# Full application without Docker: database in memory, MinIO/RabbitMQ/Elasticsearch replaced
# (see InMemoryInfrastructure). Set E2E_DATASOURCE_URL to run against a real PostgreSQL.
spring.datasource.url=${E2E_DATASOURCE_URL:jdbc:h2:mem:e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${E2E_DATASOURCE_USERNAME:sa}
spring.datasource.password=${E2E_DATASOURCE_PASSWORD:}
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
spring.elasticsearch.uris=http://localhost:1
