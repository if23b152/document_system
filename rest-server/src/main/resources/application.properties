spring.application.name=rest-server
server.port=8081

# -----------------------------------------------------------------
# 1. PostgreSQL connection (HOST CHANGED TO DOCKER SERVICE NAME)
# -----------------------------------------------------------------
# Credentials come from environment variables (defaults only for local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/documentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
# Do not log SQL statements (may contain user data)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -----------------------------------------------------------------
# 2. RabbitMQ Connection Settings (Producer)
# -----------------------------------------------------------------
# Host and Port must match the rabbitmq service in docker-compose.yml
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# -----------------------------------------------------------------
# 3. MinIO Configuration
# -----------------------------------------------------------------
minio.url=${MINIO_URL:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:documents}

# -----------------------------------------------------------------
# 4. ElasticSearch Configuration
# -----------------------------------------------------------------
spring.elasticsearch.uris=${ELASTICSEARCH_HOST}

# -----------------------------------------------------------------
# 5. Security hardening
# -----------------------------------------------------------------
# Session cookie: not readable from JavaScript, not sent on cross-site requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie

# Never leak stack traces / exception details to clients
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Behind the nginx proxy: use X-Forwarded-For / X-Real-IP from the (private network) proxy
# so login rate limiting works per real client IP instead of per proxy IP
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Optional admin bootstrap: set APP_ADMIN_PASSWORD to create the "admin" account on startup
app.admin.password=${APP_ADMIN_PASSWORD:}
