spring.application.name=rest-server
server.port=8081

# -----------------------------------------------------------------
# 1. PostgreSQL connection (HOST CHANGED TO DOCKER SERVICE NAME)
# -----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/documentdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------
# 2. RabbitMQ Connection Settings (Producer)
# -----------------------------------------------------------------
# Host and Port must match the rabbitmq service in docker-compose.yml
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# -----------------------------------------------------------------
# 3. MinIO Configuration
# -----------------------------------------------------------------
minio.url=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=documents
