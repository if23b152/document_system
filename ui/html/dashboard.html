<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Dashboard</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <!-- Optional custom CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-light dashboard-page">

<nav class="app-nav">
    <div class="app-nav-left">
        <a class="app-brand" href="dashboard.html">DMS</a>
        <a class="app-nav-link" href="dashboard.html">Dashboard</a>
    </div>
    <div class="app-nav-right">
        <div class="app-nav-meta">
            <a class="app-nav-link" href="about.html">About</a>
            <a class="app-nav-link" href="impressum.html">Impressum</a>
            <a class="app-nav-link" href="privacy.html">Privacy</a>
        </div>
        <span class="app-nav-user" id="navUser"></span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm" type="button">Logout</button>
    </div>
</nav>

<div class="page">
    <header class="header">
        <div class="header-left">
            <h1 class="fw-bold text-primary mb-1">Document Dashboard</h1>
            <p class="text-muted mb-0">Manage, upload, and search your corporate documents efficiently</p>
        </div>
        <div class="header-actions">
            <button id="themeToggleBtn" class="btn btn-outline-secondary" type="button">Dark Mode</button>
        </div>
    </header>

    <div class="toolbar">
        <form id="uploadForm" class="upload-form">
            <input type="file" class="form-control" id="fileInput" name="file" accept="application/pdf" required>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by file name" aria-label="Search documents by file name">
            <button id="searchBtn" class="btn btn-outline-primary" type="submit">Search</button>
        </form>
    </div>

    <div class="split">
        <aside class="sidebar" aria-labelledby="docs-heading">
            <h2 id="docs-heading" class="visually-hidden">Document List</h2>
            <div class="sidebar-header">
                <div class="sidebar-title">Documents</div>
                <div class="sidebar-count" id="docCount">0</div>
            </div>
            <ul id="docs" class="list-group list-group-flush">
                <!-- JavaScript will populate the list -->
            </ul>
        </aside>

        <main class="viewer">
            <div class="viewer-placeholder" id="pdfPlaceholder">Select a document to view</div>
            <iframe id="pdfPreview" class="pdf-preview" title="PDF Preview"></iframe>
        </main>
    </div>
</div>

<footer class="site-footer">
    <div>Document Management System</div>
    <div class="site-footer-links">
        <a class="site-footer-link" href="about.html">About</a>
        <a class="site-footer-link" href="impressum.html">Impressum</a>
        <a class="site-footer-link" href="privacy.html">Privacy</a>
    </div>
</footer>

<!-- Bootstrap JS + Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="../js/auth.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
