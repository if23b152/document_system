<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Reader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/document-reader.css">
</head>
<body class="bg-light">

<nav class="app-nav">
    <div class="app-nav-left">
        <a class="app-brand" href="dashboard.html">DMS</a>
        <a class="app-nav-link" href="dashboard.html">Dashboard</a>
    </div>
    <div class="app-nav-right">
        <div class="app-nav-meta">
            <a class="app-nav-link" href="about.html">About</a>
            <a class="app-nav-link" href="impressum.html">Impressum</a>
            <a class="app-nav-link" href="privacy.html">Privacy</a>
        </div>
        <span class="app-nav-user" id="navUser"></span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm" type="button">Logout</button>
    </div>
</nav>

<div class="container-fluid py-4 reader-page">
    <header class="mb-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
            <div>
                <h1 class="fw-bold text-primary mb-1">Document Reader</h1>
                <div class="text-muted" id="readerTitle">Loading...</div>
            </div>
            <div class="d-flex gap-2">
                <button id="fullscreenToggleBtn" class="btn btn-outline-secondary" type="button">Fullscreen</button>
                <button id="themeToggleBtn" class="btn btn-outline-secondary" type="button">Dark Mode</button>
                <a class="btn btn-outline-primary" href="dashboard.html">Back to Dashboard</a>
                <a class="btn btn-primary" id="openPdfBtn" href="#" target="_blank" rel="noopener">Open PDF</a>
            </div>
        </div>
    </header>

    <div class="row g-4">
        <!-- LEFT: RSVP Reader -->
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column gap-3">
                    <div class="reader-status text-muted" id="readerStatus">Preparing reader...</div>

                    <div class="reader-word-wrap">
                        <div id="wordDisplay" class="reader-word">—</div>
                    </div>

                    <div class="reader-progress text-muted">
                        <span id="wordProgress">0 / 0</span>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" id="startPauseBtn" type="button">Start</button>
                        <button class="btn btn-outline-secondary" id="resetBtn" type="button">Reset</button>
                        <button class="btn btn-outline-secondary" id="stepBackBtn" type="button">◀</button>
                        <button class="btn btn-outline-secondary" id="stepForwardBtn" type="button">▶</button>
                        <button class="btn btn-outline-secondary" id="focusToggleBtn" type="button">Focus Letter: On</button>
                    </div>

                    <div>
                        <label for="wpmInput" class="form-label fw-bold">Speed (WPM)</label>
                        <div class="d-flex align-items-center gap-3">
                            <input type="range" class="form-range" id="wpmInput" min="150" max="800" step="10">
                            <div class="reader-wpm" id="wpmValue">300</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: PDF Viewer -->
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-body p-0">
                    <div id="pdfContainer" class="pdf-container" aria-label="PDF Preview"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer">
    <div>Document Management System</div>
    <div class="site-footer-links">
        <a class="site-footer-link" href="about.html">About</a>
        <a class="site-footer-link" href="impressum.html">Impressum</a>
        <a class="site-footer-link" href="privacy.html">Privacy</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/vendor/pdf.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/document-reader.js"></script>
</body>
</html>
