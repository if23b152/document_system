<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<nav class="app-nav">
    <div class="app-nav-left">
        <a class="app-brand" href="login.html">DMS</a>
        <a class="app-nav-link" href="login.html">Login</a>
        <a class="app-nav-link" href="register.html">Register</a>
    </div>
    <div class="app-nav-right">
        <div class="app-nav-meta">
            <a class="app-nav-link" href="about.html">About</a>
            <a class="app-nav-link" href="impressum.html">Impressum</a>
            <a class="app-nav-link" href="privacy.html">Privacy</a>
        </div>
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button">Dark Mode</button>
    </div>
</nav>

<main class="auth-shell">
    <section class="auth-card">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register to manage PDFs, comments, and full-text search.</p>
        <div id="authError" class="auth-error"></div>
        <form id="registerForm" class="d-flex flex-column gap-3">
            <div>
                <label for="usernameInput" class="form-label">Username</label>
                <input id="usernameInput" class="form-control" type="text" required>
            </div>
            <div>
                <label for="emailInput" class="form-label">Email</label>
                <input id="emailInput" class="form-control" type="email" required>
            </div>
            <div>
                <label for="passwordInput" class="form-label">Password</label>
                <input id="passwordInput" class="form-control" type="password" minlength="8" required>
            </div>
            <div>
                <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                <input id="confirmPasswordInput" class="form-control" type="password" minlength="8" required>
            </div>
            <button class="btn btn-primary mt-2" type="submit">Register</button>
        </form>
        <div class="auth-footer">
            Already registered? <a href="login.html">Go to login</a>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div>Document Management System</div>
    <div class="site-footer-links">
        <a class="site-footer-link" href="about.html">About</a>
        <a class="site-footer-link" href="impressum.html">Impressum</a>
        <a class="site-footer-link" href="privacy.html">Privacy</a>
    </div>
</footer>

<script src="../js/auth.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
