<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Details</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(30,30,30,0.7) 100%);
            display: flex;
            flex-direction: column;
        }
        .glass {
            background: rgba(255,255,255,0.11);
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, .37);
            border: 1.5px solid rgba(255,0,0,0.55);
            backdrop-filter: blur(7px);
            padding: 36px 38px 24px 38px;
            margin: 50px auto;
            max-width: 520px;
            width: 95%;
            color: #fff;
        }
        h1 {
            font-size: 2.25em;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(255,0,0,0.18);
            border-bottom: 1.2px solid rgba(255,0,0,0.28);
            border-radius: 13px;
            padding-bottom: 9px;
            background: rgba(255,0,0,0.08);
            display: inline-block;
        }
        .detail-block p {
            font-size: 1.11em;
            border-bottom: 1px solid rgba(255,0,0,0.16);
            margin-bottom: 9px;
            padding-bottom: 7px;
        }
        .red-btn {
            color: #fff;
            background: rgba(255,255,255,0.15);
            border: 1.6px solid rgba(255,0,0,0.9);
            border-radius: 50px;
            padding: 8px 28px;
            font-size: 1.08em;
            font-weight: 500;
            margin: 14px 0 0 0;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,0,0,0.09);
            transition: background 0.18s, transform 0.16s;
            display: inline-block;
        }
        .red-btn:hover {
            background: rgba(255,0,0,0.23);
            transform: translateY(-2px) scale(1.05);
        }
        .team-names {
            position: fixed;
            right: 26px;
            bottom: 19px;
            background: rgba(255,255,255,0.13);
            border-radius: 22px;
            border: 1.3px solid rgba(255,0,0,0.45);
            padding: 13px 22px;
            font-size: 1.14em;
            color: #fceded;
            box-shadow: 0 3px 12px rgba(255,0,0,0.13);
            letter-spacing: 0.8px;
            font-weight: 480;
            z-index: 99;
            text-align: right;
            user-select: none;
        }
    </style>
</head>
<body>
<div class="glass">
    <h1>Document Details</h1>
    <div class="detail-block" id="details"></div>
    <a href="dashboard.html" class="red-btn">Zurück zum Dashboard</a>
</div>
<div class="team-names">
    Mikail&nbsp;&nbsp;|&nbsp;&nbsp;Nichita&nbsp;&nbsp;|&nbsp;&nbsp;Ibrahim
</div>

<script>
    function getIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
    }
    function loadDetail() {
        const id = getIdFromUrl();
        fetch(`/api/documents/${id}`)
            .then(res => {
                if (!res.ok) throw new Error("Nicht gefunden");
                return res.json();
            })
            .then(doc => {
                document.getElementById('details').innerHTML = `
            <p><b>File Name:</b> ${doc.fileName}</p>
            <p><b>Upload Timestamp:</b> ${doc.uploadTimestamp}</p>
            <p><b>Summary:</b> ${doc.summary || "(noch nicht erstellt)"}</p>
            <p><b>Tags:</b> ${doc.tags || "(keine)"}</p>
          `;
            })
            .catch(() => {
                document.getElementById('details').innerText = "Document wurde nicht gefunden!";
            });
    }
    loadDetail();
</script>
</body>
</html>
