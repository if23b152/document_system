<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Details</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional custom CSS -->
    <link rel="stylesheet" href="../css/document-details.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Header / Hero -->
    <header class="mb-5">
        <div class="card shadow-sm rounded-4">
            <div class="card-body text-center py-5">
                <h1 class="fw-bold text-primary mb-3">Document Details</h1>
                <p class="text-muted mb-0">
                    View and edit metadata for your document
                </p>
            </div>
        </div>
    </header>

    <!-- Two-column layout: Details left, Edit Form right -->
    <div class="row g-4">

        <!-- Details Column -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h2 class="h5 fw-bold mb-4 text-primary">Document Information</h2>

                        <form id="detailsForm" class="row g-3">
                            <!-- File Name -->
                            <div class="col-12">
                                <label for="detailFileName" class="form-label text-muted">File Name</label>
                                <input type="text" id="detailFileName" class="form-control fw-bold" readonly>
                            </div>

                            <!-- File Size -->
                            <div class="col-12">
                                <label for="detailFileSize" class="form-label text-muted">File Size</label>
                                <input type="text" id="detailFileSize" class="form-control fw-bold" readonly>
                            </div>

                            <!-- Uploaded On -->
                            <div class="col-12">
                                <label for="detailUploadedOn" class="form-label text-muted">Uploaded On</label>
                                <input type="text" id="detailUploadedOn" class="form-control fw-bold" readonly>
                            </div>

                            <!-- Tags -->
                            <div class="col-12">
                                <label for="detailTags" class="form-label text-muted">Tags</label>
                                <input type="text" id="detailTags" class="form-control fw-bold" readonly>
                            </div>

                            <!-- Summary -->
                            <div class="col-12">
                                <label for="detailSummary" class="form-label text-muted">Summary</label>
                                <textarea id="detailSummary" class="form-control fw-bold" rows="4" readonly></textarea>
                            </div>
                        </form>
                    </div>

                    <!-- Buttons: Back + Delete -->
                    <div class="d-flex gap-2 mt-3">
                        <a href="dashboard.html" class="btn btn-primary w-50">Back to Dashboard</a>
                        <button id="deleteBtn" class="btn btn-danger w-50">Delete Document</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Form Column -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h2 class="h5 fw-bold mb-4 text-primary">Edit Metadata</h2>
                        <form id="editForm" class="d-flex flex-column gap-3">
                            <div>
                                <label for="fileNameInput" class="form-label">File Name</label>
                                <input type="text" id="fileNameInput" class="form-control" required>
                            </div>

                            <div>
                                <label for="tagsInput" class="form-label">Tags</label>
                                <input type="text" id="tagsInput" class="form-control" placeholder="Comma-separated">
                            </div>

                            <div>
                                <label for="summaryInput" class="form-label">Summary</label>
                                <textarea id="summaryInput" class="form-control" rows="4"
                                          placeholder="Add or edit summary"></textarea>
                            </div>
                        </form>
                    </div>

                    <!-- Cancel + Save Changes side by side -->
                    <div class="d-flex gap-2 mt-3">
                        <button type="button" id="cancelBtn" class="btn btn-secondary w-50">Cancel</button>
                        <button type="submit" form="editForm" class="btn btn-primary w-50">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ===================== -->
    <!-- Comments Section -->
    <!-- ===================== -->
    <div class="row mt-5">
        <div class="col-12">
            <div class="card shadow-sm rounded-4">
                <div class="card-body">

                    <h2 class="h4 fw-bold text-primary mb-4">Comments</h2>

                    <!-- Add Comment -->
                    <div class="mb-4">
                        <h5 class="mb-3">Add a Comment</h5>

                        <form id="commentForm">
                            <div class="mb-3">
                                <textarea
                                        id="commentInput"
                                        class="form-control rounded-3"
                                        rows="3"
                                        placeholder="Write your comment here..."
                                        required
                                ></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary px-4">
                                Post Comment
                            </button>
                        </form>
                    </div>

                    <hr>

                    <!-- Comments List -->
                    <div>
                        <h5 class="mb-3">All Comments</h5>
                        <ul id="commentsList" class="list-group list-group-flush">
                            <!-- JS injects comments here -->
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS + Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="../js/document-details.js"></script>
</body>
</html>
