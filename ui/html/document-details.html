<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Details</title>
    <link rel="stylesheet" href="../css/document-details.css">
</head>
<body>
<main class="details-container">
    <header class="details-header">
        <h1>Document Details</h1>
    </header>

    <!-- Details display -->
    <section class="detail-block" id="details" aria-labelledby="details-heading">
        <h2 id="details-heading" class="sr-only">Document Details Information</h2>
    </section>

    <!-- Back button -->
    <a href="dashboard.html" class="btn btn-primary back-btn">Back to Dashboard</a>

    <!-- Edit form -->
    <section class="edit-block">
        <h2>Edit Metadata</h2>
        <form id="editForm">
            <label>
                File Name
                <input type="text" id="fileNameInput" required>
            </label>

            <label>
                Summary
                <textarea id="summaryInput" rows="4" placeholder="Add or edit summary"></textarea>
            </label>

            <label>
                Tags
                <input type="text" id="tagsInput" placeholder="Comma-separated">
            </label>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </section>
    <!-- Delete button -->
    <button id="deleteBtn" class="btn btn-danger">Delete</button>
</main>

<script src="../js/document-details.js"></script>
</body>
</html>
