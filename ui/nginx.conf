# Run 1 worker process (enough for a small student project)
worker_processes 1;

events {
    worker_connections 1024; # Each worker can handle 1024 connections
}

http {
    include mime.types; # Include standard MIME type mappings
    default_type application/octet-stream; # Default type if unknown

    sendfile on; # Efficient file transfer (static assets)
    keepalive_timeout 65; # Keep connections alive for 65 seconds

    server {
        listen 80; # Listen on port 80 inside the container
        server_name localhost; # Hostname (not critical here)

        # Root directory where static files are served from
        root /usr/share/nginx/html;
        # Default page when visiting http://localhost:8080/
        index index.html;

        # Serve static files (HTML, CSS, JS, etc.)
        location / {
            try_files $uri $uri/ =404; # Try the file, else return 404
        }

        # Explicitly define CSS location
        location /css/ {
            try_files $uri =404; # Return 404 if file not found
        }

        # Explicitly define JS location
        location /js/ {
            try_files $uri =404; # Return 404 if file not found
        }

        # Proxy API requests to backend (Spring Boot)
        location /api/ {
            proxy_pass http://rest-server:8081; # Forward to backend service
            proxy_set_header Host $host; # Preserve original host
            proxy_set_header X-Real-IP $remote_addr; # Pass client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # For logging
        }

        # Optional: if file not found, serve dashboard.html instead
        error_page 404 /index.html;
    }
}
