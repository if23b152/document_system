version: "3.9"

services:
  # -----------------------------------------------------------------
  # 1. Database Service
  # -----------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: dms-postgres
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -----------------------------------------------------------------
  # 2. Messaging Broker Service
  # -----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dms-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 3. MinIO Service (NEW for Sprint 4)
  # -----------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dms-minio
    restart: always
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------------
  # 4. REST Server (PRODUCER)
  # -----------------------------------------------------------------
  rest-server:
    build:
      context: ./rest-server
      dockerfile: Dockerfile
    container_name: rest-server
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      # MinIO connection for file upload
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:  # Ensure MinIO starts before uploads
        condition: service_healthy

  # -----------------------------------------------------------------
  # 5. Worker Service (CONSUMER)
  # -----------------------------------------------------------------
  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: worker-service
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # MinIO connection for file download (same config)
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      minio:
        condition: service_healthy

  # -----------------------------------------------------------------
  # 6. UI Service
  # -----------------------------------------------------------------
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    ports:
      - "8080:80"
    depends_on:
      - rest-server

volumes:
  pgdata:
  minio_data:
