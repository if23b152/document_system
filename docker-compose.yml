version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: dms-postgres
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rest-server:
    build:
      context: ./rest-server
      dockerfile: Dockerfile
    container_name: rest-server
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/documentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

  ui: # Define a service named "ui"
    build:
      context: ./ui # Look for Dockerfile in ./ui directory
      dockerfile: Dockerfile # Use this Dockerfile to build the image
    container_name: ui # Name the container "ui" for easier debugging
    ports:
      - "8080:80" # Map host port 8080 -> container port 80
      # So you open http://localhost:8080 in your browser
    depends_on:
      - rest-server # Ensure "rest-server" is started before UI


volumes:
  pgdata:
