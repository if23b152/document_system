name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token by default; jobs request more only where needed
permissions:
  contents: read

# Cancel superseded runs of the same branch / pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [rest-server, worker-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

      - name: Test and coverage summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo
            awk -F'"' '/<testsuite /{for (i=1;i<NF;i++){if($i~/ tests=$/)t+=$(i+1); if($i~/ failures=$/)f+=$(i+1); if($i~/ errors=$/)e+=$(i+1); if($i~/ skipped=$/)s+=$(i+1)}} END {printf "| Tests | Failures | Errors | Skipped |\n|---:|---:|---:|---:|\n| %d | %d | %d | %d |\n", t, f, e, s}' target/surefire-reports/TEST-*.xml 2>/dev/null || echo "No test reports found."
            echo
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 {m+=$8; c+=$9} END {if (m+c) printf "Line coverage: **%.1f %%** (%d of %d lines)\n", 100*c/(m+c), c, m+c}' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 14

  docker:
    name: docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [rest-server, worker-service, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push) to catch broken Dockerfiles; layers are cached between runs
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: document-system/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The templates must contain every variable the stack needs
      - name: Validate compose file with the example environment
        run: |
          cp .env.example .env
          cp api.env.example api.env
          docker compose config --quiet
          echo "Services: $(docker compose config --services | tr '\n' ' ')"
